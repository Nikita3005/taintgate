[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taintgate"
version = "0.1.0"
description = "Provenance-aware runtime firewall for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TaintGate contributors" }]
keywords = ["ai-agents", "security", "guardrails", "mcp", "llm", "runtime-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ['tomli>=2.0; python_version < "3.11"']

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
openai = ["openai-agents>=0.21.1"]

[project.scripts]
taintgate = "taintgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taintgate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
